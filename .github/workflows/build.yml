name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mixinbooter-version:
          - "10.0"
          - "10.7"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build with Gradle
        run: .\gradlew.bat --no-daemon build -PwithFluxApplied=true -Pmixinbooter_version=${{ matrix.mixinbooter-version }} --stacktrace
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem build\libs\*.jar |
            Where-Object Name -NotLike '*-dev.jar' |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              Set-Content -Path "$($_.FullName).sha256" -Value "$hash  $($_.Name)"
            }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appliedthermal-jars-mixinbooter-${{ matrix.mixinbooter-version }}
          path: |
            build/libs/AppliedThermal-AE2UEL-*.jar
            !build/libs/*-dev.jar
            build/libs/*.sha256
