name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv4Addresses=true
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Checkout CoFH Core sources
        uses: actions/checkout@v4
        with:
          repository: CoFH/CoFHCore
          ref: 1bf35c796966f5d138a5a9540d3a3901d8cb7922
          path: deps/CoFHCore
      - name: Checkout Thermal sources
        uses: actions/checkout@v4
        with:
          repository: CoFH/ThermalCore
          ref: 5892f3303cbedb19064b364e383531d1351d73f2
          path: deps/Thermal
      - name: Checkout Thermal Expansion sources
        uses: actions/checkout@v4
        with:
          repository: CoFH/ThermalExpansion
          ref: 9dc6061173c6732fd3bcdbf4d3c2baf3dc82f089
          path: deps/ThermalExpansion
      - name: Trim optional CoFH integrations
        shell: pwsh
        run: .\scripts\prepare-cofh-ci.ps1 -Root "$PWD\deps"
      - name: Publish CoFH Core to Maven Local
        working-directory: deps/CoFHCore
        run: .\gradlew.bat --no-daemon publishToMavenLocal -x test
      - name: Publish Thermal to Maven Local
        working-directory: deps/Thermal
        run: .\gradlew.bat --no-daemon publishToMavenLocal -x test
      - name: Publish Thermal Expansion to Maven Local
        working-directory: deps/ThermalExpansion
        run: .\gradlew.bat --no-daemon publishToMavenLocal -x test
      - name: Build addon
        run: .\gradlew.bat --no-daemon build --stacktrace
      - name: Resolve AppFlux optional runtime
        run: .\gradlew.bat --no-daemon verifyOptionalRuntime -Penable_appflux_runtime=true --stacktrace
      - name: Write SHA-256 checksums
        shell: pwsh
        run: Get-ChildItem build/libs/*.jar | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } | Set-Content build/libs/SHA256SUMS.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: appliedthermal-jars
          path: |
            build/libs/*.jar
            build/libs/SHA256SUMS.txt
