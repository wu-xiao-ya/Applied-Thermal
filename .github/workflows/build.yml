name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build
        run: .\gradlew.bat --no-daemon build --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appliedthermal-jars
          path: build/libs/*.jar
