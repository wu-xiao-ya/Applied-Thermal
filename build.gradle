        "https://github.com/NNYYOONNIIOO/terminal_interaction_integration/releases/download/1.0.0/"
            + "terminal_interaction_integration-1.0.jar",
        "3C6ED9F22F46BEE7717FA8FACF86D0F0EB95E82982BFDA20E1FD7F4F0D843C43"
