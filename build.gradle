    dependencies.add("modCompileOnly", "local.appliedthermal:terminal_interaction_integration:1.0")
    dependencies.add("modRuntimeOnly", "local.appliedthermal:flux_applied:1.0.0")
    dependencies.add("modRuntimeOnly", "local.appliedthermal:terminal_interaction_integration:1.0")
}

processResources {
    inputs.property("mod_id", mod_id)
    inputs.property("mod_name", mod_name)
    inputs.property("mod_version", mod_version)
    inputs.property("mod_description", mod_description)

    filesMatching(["mcmod.info", "pack.mcmeta"]) {
        expand(
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            mod_description: mod_description
        )
    }
}

jar {
    manifest {
        attributes(
            "FMLCorePlugin": "com.recursivepineapple.appliedthermal.core.AppliedThermalCore",
            "FMLCorePluginContainsFMLMod": "true",
            "ForceLoadAsMod": "true"
        )
    }
}
