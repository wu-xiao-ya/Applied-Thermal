plugins {
    id "java"
    id "java-library"
    id "xyz.wagyourtail.unimined" version "1.4.23-kappa"
}

group = mod_group
version = mod_version
def enableFluxAppliedRuntime = providers.gradleProperty("withFluxApplied")
    .map { it.toBoolean() }
    .orElse(false)
    .get()
def mixinBooterVersion = providers.gradleProperty("mixinbooter_version")
    .orElse("10.0")
    .get()

def verifiedRemoteFile = { String fileName, String url, String expectedSha256 ->
    File cacheDir = new File(gradle.gradleUserHomeDir, "caches/appliedthermal")
    File target = new File(cacheDir, fileName)
    cacheDir.mkdirs()

    def sha256 = { File file ->
        def digest = java.security.MessageDigest.getInstance("SHA-256")
        file.withInputStream { stream ->
            byte[] buffer = new byte[8192]
            int read
            while ((read = stream.read(buffer)) >= 0) {
                digest.update(buffer, 0, read)
            }
        }
        digest.digest().collect { String.format("%02X", it) }.join()
    }

    if (!target.isFile() || !sha256(target).equalsIgnoreCase(expectedSha256)) {
        logger.lifecycle("Downloading ${fileName}")
        File temporary = new File(cacheDir, "${fileName}.part")
        temporary.delete()
        new URL(url).withInputStream { input ->
            temporary.withOutputStream { output -> output << input }
        }
        String actual = sha256(temporary)
        if (!actual.equalsIgnoreCase(expectedSha256)) {
            temporary.delete()
            throw new GradleException("SHA-256 mismatch for ${fileName}: expected ${expectedSha256}, got ${actual}")
        }
        java.nio.file.Files.move(
            temporary.toPath(),
            target.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
    }
    return target
}

def ae2UelDevJar = verifiedRemoteFile(
    "ae2-uel-v0.56.7-dev.jar",
    "https://github.com/AE2-UEL/Applied-Energistics-2/releases/download/v0.56.7/ae2-uel-v0.56.7-dev.jar",
    "8B1B982AC2CB905B89B17740BC2118BE36C5C2EF60838C6A36C0E198CEC57DBD"
)

base {
    archivesName = mod_archives_name
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
}

repositories {
    mavenLocal()
    flatDir {
        dirs new File(gradle.gradleUserHomeDir, "caches/appliedthermal")
    }
    maven {
        name = "CleanroomMC"
        url = "https://maven.cleanroommc.com"
    }
    maven {
        name = "MinecraftForge"
        url = "https://maven.minecraftforge.net/"
        metadataSources {
            mavenPom()
            artifact()
        }
    }
    maven {
        name = "Sponge"
        url = "https://repo.spongepowered.org/maven"
        metadataSources {
            mavenPom()
            artifact()
        }
    }
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
    }
    maven {
        name = "CleanroomCurseMaven"
        url = "https://curse.cleanroommc.com"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "CoFH"
        url = "https://maven.covers1624.net"
    }
    maven {
        name = "JitPack"
        url = "https://www.jitpack.io"
        content {
            includeGroupByRegex("com\\.github\\..*")
        }
    }
    maven {
        name = "FirstDarkDev"
        url = "https://maven.firstdarkdev.xyz/releases/"
    }
    maven {
        name = "WagYourMaven"
        url = "https://maven.wagyourtail.xyz/releases"
    }
    mavenCentral()
}

configurations {
    modCompileOnly
    compileOnly.extendsFrom(modCompileOnly)
    modRuntimeOnly
    runtimeOnly.extendsFrom(modRuntimeOnly)
}

unimined.minecraft {
    version "1.12.2"

    mappings {
        mcp("stable", "39-1.12")
    }

    cleanroom {
        loader "0.5.14-alpha"
        runs.auth.username = "Dev"
        runs.all {
            systemProperty("crl.dev.mixin", "appliedthermal.ae.mixins.json")
            systemProperty("mixin.debug.export", "true")
            systemProperty("fml.coreMods.load", "com.recursivepineapple.appliedthermal.core.AppliedThermalCore")
            systemProperty(
                "net.minecraftforge.gradle.GradleStart.srg.notch-srg",
                new File(gradle.gradleUserHomeDir,
                    "caches/minecraft/de/oceanlabs/mcp/mcp_stable/39/1.12.2/srgs/notch-srg.srg").absolutePath
            )
            systemProperty(
                "net.minecraftforge.gradle.GradleStart.csvDir",
                new File(gradle.gradleUserHomeDir,
                    "caches/minecraft/de/oceanlabs/mcp/mcp_stable/39").absolutePath
            )
        }
    }

    defaultRemapJar = true

    mods {
        remap(configurations.modCompileOnly)
        remap(configurations.modRuntimeOnly)
    }
}

dependencies {
    compileOnly "com.cleanroommc:sponge-mixin:0.20.12+mixin.0.8.7"
    compileOnly "zone.rong:mixinbooter:${mixinBooterVersion}"

    compileOnly files(ae2UelDevJar)
    modRuntimeOnly "curse.maven:ae2-extended-life-570458:6302098"
    modCompileOnly "curse.maven:CoFHCore-69162:2920433"
    modCompileOnly "curse.maven:ThermalFoundation-222880:2926428"
    modCompileOnly "curse.maven:ThermalExpansion-69163:2926431"
    modCompileOnly "cofh:RedstoneFlux:1.12-2.1.0.+:universal"
    modCompileOnly "mezz:jei:4.31.2"

    modRuntimeOnly "curse.maven:CoFHCore-69162:2920433"
    modRuntimeOnly "curse.maven:ThermalFoundation-222880:2926428"
    modRuntimeOnly "curse.maven:ThermalExpansion-69163:2926431"
    modRuntimeOnly "curse.maven:CoFHWorld-271384:2567263"
    modRuntimeOnly "cofh:RedstoneFlux:1.12-2.1.0.+:universal"
    modRuntimeOnly "curse.maven:codechicken-lib-1-8-242818:2779848"

}

