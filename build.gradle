buildscript {
    repositories {
        maven {
            name = "Forge"
            url = "https://maven.minecraftforge.net"
        }
        mavenCentral()
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:6.0.54"
    }
}

plugins {
    id "java-library"
    id "eclipse"
    id "maven-publish"
}

apply plugin: "net.minecraftforge.gradle"

group = mod_group
version = mod_version

base {
    archivesName = mod_archives_name
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version as int)
    }
    withSourcesJar()
}

sourceSets {
    main {
        resources.srcDir "src/generated/resources"
    }
}

repositories {
    mavenLocal()
    maven {
        name = "Forge"
        url = "https://maven.minecraftforge.net"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    mavenCentral()
}

minecraft {
    mappings channel: "official", version: minecraft_version
    accessTransformer = file("src/main/resources/META-INF/accesstransformer.cfg")

    runs {
        configureEach {
            property "mixin.env.remapRefMap", "true"
            property "mixin.env.refMapRemappingFile",
                    file("${buildDir}/createSrgToMcp/output.srg").absolutePath
            arg "-mixin.config=appliedthermal.ae.mixins.json"
            arg "-mixin.config=appliedthermal.thermal.mixins.json"
        }

        client {
            workingDirectory project.file("run")
            property "forge.logging.console.level", "debug"
            mods {
                appliedthermal {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file("run")
            property "forge.logging.console.level", "debug"
            mods {
                appliedthermal {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file("run")
            args "--mod", mod_id, "--all", "--output", file("src/generated/resources"), "--existing", file("src/main/resources")
            mods {
                appliedthermal {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}")
    runtimeOnly fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}")
    compileOnly fg.deobf("org.appliedenergistics:guideme:${guideme_version}")
    runtimeOnly fg.deobf("org.appliedenergistics:guideme:${guideme_version}")

    compileOnly fg.deobf("com.teamcofh:cofh_core:${cofh_core_version}")
    runtimeOnly fg.deobf("com.teamcofh:cofh_core:${cofh_core_version}")

    compileOnly fg.deobf("com.teamcofh:thermal_core:${thermal_core_version}")
    runtimeOnly fg.deobf("com.teamcofh:thermal_core:${thermal_core_version}")

    compileOnly fg.deobf("com.teamcofh:thermal_expansion:${thermal_expansion_version}")
    runtimeOnly fg.deobf("com.teamcofh:thermal_expansion:${thermal_expansion_version}")

    compileOnly("maven.modrinth:appflux:${appflux_version}") {
        transitive = false
    }
    if (providers.gradleProperty("enable_appflux_runtime").orNull == "true") {
        runtimeOnly fg.deobf("maven.modrinth:appflux:${appflux_version}")
        runtimeOnly fg.deobf("maven.modrinth:glodium:${glodium_version}")
    }

    compileOnly "org.spongepowered:mixin:0.8.5"
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
}

tasks.register("verifyOptionalRuntime") {
    doLast {
        if (providers.gradleProperty("enable_appflux_runtime").orNull != "true") {
            throw new GradleException("Run with -Penable_appflux_runtime=true")
        }
        def runtimeFiles = configurations.runtimeClasspath.resolve()
        if (!runtimeFiles.any { it.name.toLowerCase(Locale.ROOT).contains("appflux") }
                || !runtimeFiles.any { it.name.toLowerCase(Locale.ROOT).contains("glodium") }) {
            throw new GradleException("AppFlux or Glodium is missing from runtimeClasspath")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = java_version as int
}

processResources {
    inputs.properties(
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        mod_description: mod_description,
        mod_url: mod_url,
        mod_license: mod_license,
        mod_authors: mod_authors,
        mod_credits: mod_credits,
        minecraft_version: minecraft_version,
        forge_version: forge_version,
        ae2_version: ae2_version,
        cofh_core_version: cofh_core_version,
        thermal_core_version: thermal_core_version,
        thermal_expansion_version: thermal_expansion_version,
        appflux_version: appflux_version,
        glodium_version: glodium_version,
        loader_version_range: loader_version_range,
        minecraft_version_range: minecraft_version_range,
        forge_version_range: forge_version_range
    )

    filesMatching(["META-INF/mods.toml", "pack.mcmeta"]) {
        expand(
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            mod_description: mod_description,
            mod_url: mod_url,
            mod_license: mod_license,
            mod_authors: mod_authors,
            mod_credits: mod_credits,
            minecraft_version: minecraft_version,
            forge_version: forge_version,
            ae2_version: ae2_version,
            cofh_core_version: cofh_core_version,
            thermal_core_version: thermal_core_version,
            thermal_expansion_version: thermal_expansion_version,
            appflux_version: appflux_version,
            glodium_version: glodium_version,
            loader_version_range: loader_version_range,
            minecraft_version_range: minecraft_version_range,
            forge_version_range: forge_version_range
        )
    }
}

jar {
    manifest {
        attributes(
            "Specification-Title": mod_name,
            "Specification-Vendor": mod_authors,
            "Specification-Version": mod_version,
            "Implementation-Title": mod_name,
            "Implementation-Version": mod_version,
            "Implementation-Vendor": mod_authors,
            "MixinConfigs": "appliedthermal.ae.mixins.json,appliedthermal.thermal.mixins.json"
        )
    }
}
