    verifiedRemoteFile(
        "flux_applied-1.0.0.jar",
        "https://github.com/NNYYOONNIIOO/Flux_Applied/releases/download/1.0.0/flux_applied-1.0.0.jar",
        "42A2AF60B7F53EFCFE0AA9A63205295BB46C051ABBFAD533CD863AECBB647566"
    )
